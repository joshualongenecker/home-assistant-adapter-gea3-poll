[platformio]

[env]
framework = arduino

build_flags =
  -std=gnu11
  -Iconfig

lib_deps =
  knolleary/PubSubClient@^2.8
  arduino-libraries/NTPClient@^3.2.1
  geappliances/home-assistant-bridge@^1.3.0

# arduino-tiny's tiny_uart.cpp calls Serial.begin(baud, SerialConfig), but on
# ESP32-C3 Serial maps to HWCDC which only accepts begin(baud).  Our code uses
# tiny_uart_adapter_init (Serial1) and never calls tiny_uart_init, so the file
# is unused and can be safely excluded.
lib_build_filter = +<*> -<tiny_uart.cpp>

build_src_flags =
  -Wall
  -Wextra
  -Werror

[env:xiao_c3]
platform = espressif32@^6.9.0
board = seeed_xiao_esp32c3
upload_protocol = esptool
debug_tool = esp-builtin

build_unflags =
  ${env.build_unflags}
  -std=gnu99

build_flags =
  ${env.build_flags}
  -DLED_HEARTBEAT=D0
  -DLED_MQTT=D1
  -DLED_WIFI=D2
