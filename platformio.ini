[platformio]

[env]
framework = arduino

build_flags =
  -std=gnu11
  -Iconfig

lib_deps =
  knolleary/PubSubClient@^2.8
  arduino-libraries/NTPClient@^3.2.1
  geappliances/home-assistant-bridge@^1.3.0

# arduino-tiny's tiny_uart.cpp calls Serial.begin(baud, SerialConfig), but
# HWCDC (Serial on ESP32-C3) only accepts begin(baud).  See PORTING.md for
# details; fix is to unset ARDUINO_USB_CDC_ON_BOOT=1 so Serial = HardwareSerial.
build_unflags =
  -DARDUINO_USB_CDC_ON_BOOT=1

build_src_flags =
  -Wall
  -Wextra
  -Werror

[env:xiao_c3]
platform = espressif32@^6.9.0
board = seeed_xiao_esp32c3
upload_protocol = esptool
debug_tool = esp-builtin

build_unflags =
  ${env.build_unflags}
  -std=gnu99

build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DLED_HEARTBEAT=D0
  -DLED_MQTT=D1
  -DLED_WIFI=D2
