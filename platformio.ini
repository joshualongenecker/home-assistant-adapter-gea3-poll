[platformio]

[env]
framework = arduino

build_flags =
  -std=gnu11
  -Iconfig

lib_deps =
  knolleary/PubSubClient@^2.8
  arduino-libraries/NTPClient@^3.2.1
  geappliances/home-assistant-bridge@^1.3.0

build_src_flags =
  -Wall
  -Wextra
  -Werror

[env:xiao_c6]
platform = espressif32@^6.9.0
board = esp32-c6-devkitc-1
upload_protocol = esptool
debug_tool = esp-builtin

build_unflags =
  ${env.build_unflags}
  -std=gnu99

build_flags =
  ${env.build_flags}
  -DLED_HEARTBEAT=15
  -DLED_MQTT=16
  -DLED_ZIGBEE=17
  -DCONFIG_ZB_ENABLED=1
  
monitor_speed = 115200
