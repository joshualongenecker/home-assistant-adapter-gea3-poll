# GEA2 Home-Assistant adapter — ESPHome configuration
#
# Target hardware: Seeed XIAO ESP32-C3 on the FirstBuild carrier board
# (RJ45 GEA2 connector wired to GPIO9 TX / GPIO10 RX).
#
# Framework: Arduino (via ESPHome/PlatformIO).
# This gives the GEA2 bridge code full Arduino API access (HardwareSerial,
# Preferences, String) and allows the home-assistant-bridge PlatformIO
# library to be resolved via lib_deps, while keeping ESPHome's native
# MQTT integration.
#
# Usage
# -----
# 1. Copy this file and fill in the secrets below (or use secrets.yaml).
# 2. Install ESPHome:  pip install esphome
# 3. Compile & flash:  esphome run gea2_bridge.yaml

substitutions:
  device_name: gea2-bridge
  # Unique identifier used as the MQTT topic prefix:
  #   geappliances/<device_id>/erd/0x<XXXX>/value
  device_id: "my_gea2_appliance"

esphome:
  name: ${device_name}
  friendly_name: "GEA2 Appliance Bridge"

  # platformio_options are forwarded to the underlying PlatformIO build.
  # lib_deps here supplement the libraries added by the component's __init__.py
  # (geappliances/home-assistant-bridge and PubSubClient are added there).
  platformio_options:
    # deep+ mode makes PlatformIO recursively scan every library's own includes
    # so that transitive headers (e.g. PubSubClient.h inside home-assistant-bridge)
    # are always found during compilation.
    lib_ldf_mode: deep+
    build_flags:
      - "-std=gnu++17"
    # Note: ARDUINO_USB_CDC_ON_BOOT=0 is set automatically by the gea2_bridge
    # component's __init__.py (via cg.add_build_unflag / cg.add_build_flag) so
    # users do not need to add it here manually.

esp32:
  board: seeed_xiao_esp32c3
  # Use the Arduino framework so that Arduino APIs (HardwareSerial, Preferences,
  # String, Stream) and PlatformIO Arduino libraries (home-assistant-bridge) are
  # available to the bridge code without additional configuration.
  framework:
    type: arduino

# ESPHome logging — routed to UART0 (GPIO20=RX, GPIO21=TX on ESP32-C3).
# USB CDC (HWCDC) is disabled via ARDUINO_USB_CDC_ON_BOOT=0 (set automatically
# by the gea2_bridge component) so that tiny_uart.cpp compiles.  Connect a
# USB-serial adapter to GPIO20/21 for development logging, or rely on WiFi
# logging via the ESPHome API (visible in the ESPHome dashboard) for normal
# operation.
logger:
  baud_rate: 115200
  hardware_uart: UART0

# Over-the-air updates.
ota:
  - platform: esphome
    password: !secret ota_password

# WiFi — ESPHome manages the connection; no code needed in the component.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

# Captive portal for the fallback AP.
captive_portal:

# ESPHome native MQTT.  The gea2_bridge component publishes ERD values and
# subscribes to write topics through this client automatically.
mqtt:
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  username: !secret mqtt_username
  password: !secret mqtt_password
  # Disable ESPHome's built-in discovery topics — the bridge manages its own
  # topic namespace under geappliances/<device_id>/.
  discovery: false

# Pull the external component from GitHub.
external_components:
  - source:
      type: git
      url: https://github.com/joshualongenecker/home-assistant-adapter-gea3-poll
      ref: copilot/add-gea2-polling-feature
    components: [gea2_bridge]

# GEA2 bridge component.
#
# tx_pin / rx_pin — must match the hardware wiring on your carrier board.
#   Seeed XIAO ESP32-C3 on the FirstBuild board:
#     D9  = GPIO9  → TX (to appliance RX)
#     D10 = GPIO10 → RX (from appliance TX)
#
# client_address — the GEA2 address this adapter presents on the bus.
#   0xE4 is the address used by the reference firmware; change only if
#   another device on the bus already uses it.
gea2_bridge:
  device_id: ${device_id}
  tx_pin: 9     # GPIO9  = D9  on XIAO ESP32-C3
  rx_pin: 10    # GPIO10 = D10 on XIAO ESP32-C3
  client_address: 0xE4
