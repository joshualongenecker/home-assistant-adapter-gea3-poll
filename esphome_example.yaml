# Example ESPHome configuration for the GE Appliances GEA2 polling bridge.
#
# This configuration connects to a GE Appliances device via the GEA2 protocol,
# polls all discoverable ERDs, and publishes their values to Home Assistant
# via MQTT.
#
# Hardware: Xiao ESP32-C3 on the GE Home Assistant adapter carrier board
# (https://firstbuild.com/inventions/home-assistant-adapter/)
#
# Based on PaulGoodJohn's GEA2 Polling Adapter:
# https://github.com/paulgoodjohn/home-assistant-adapter

esphome:
  name: ge-appliance-bridge
  friendly_name: GE Appliance Bridge
  platformio_options:
    build_flags:
      - "-std=gnu++17"
    build_unflags:
      - "-std=gnu++11"

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO

# WiFi connection
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "GE-Appliance-Bridge"
    password: "geappliance"

captive_portal:

# MQTT configuration for Home Assistant
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  port: 1883
  discovery: true
  discovery_prefix: homeassistant

# UART configuration for GEA2 communication
# GEA2 uses 19200 baud on the older appliances.
#
# IMPORTANT: tx_pin MUST use open_drain: true on this carrier board.
#
# The GEA2 bus transceiver circuit uses a PNP transistor (Q102, DTA143XU)
# driven by an open-drain TX buffer (U101, M74VHC1G07) to source current
# onto the 5 V GEA2 bus. When the TX GPIO is in the default push-pull mode,
# the UART idle state (TX=HIGH) fully saturates Q102, actively driving the bus
# to 5 V through R101 (120 Ω). When the appliance tries to respond by pulling
# the bus LOW, it fights Q102's strong high-side drive; the bus only drops to
# ~4 V (≈ 8 mA × 120 Ω drop), which is not enough for the RX buffer (U102)
# to register a logic transition on its Schmitt-trigger input — so no appliance
# bytes are ever received.
#
# Configuring TX as open_drain changes the idle (HIGH) behaviour: the ESP32
# GPIO pad becomes HIGH-Z rather than actively driving 3.3 V. U101's input
# (which has no external pull) retains the 0 V level from the most recent
# LOW-driven bit; U101's output stays HIGH-Z, and Q102 is only weakly biased
# (V_EB ≈ 0.85 V, barely above the ~0.6 V threshold) rather than fully
# saturated. The appliance's response can then pull the bus to near 0 V,
# giving U102 a clean logic transition to deliver to the ESP's RX pin.
#
# TX LOW ('0' bits / start bit) is unaffected: in open-drain mode the GPIO
# still actively drives LOW → U101 INA = LOW → U101 stays HIGH-Z → the
# R104/R105 divider to GND (69 KΩ total) pulls the internal node to GND,
# and through R101 (120 Ω) that also pulls the external bus to GND.
uart:
  - id: gea2_uart
    tx_pin:
      number: GPIO9   # D9 on Xiao ESP32-C3
      open_drain: true  # Required: prevents Q102 from blocking appliance RX (see above)
    rx_pin: GPIO10  # D10 on Xiao ESP32-C3
    baud_rate: 19200

# GE Appliances Bridge component
# This component discovers ERDs on the connected appliance, builds a poll list,
# and continuously publishes ERD values to MQTT.
#
# MQTT topics published:
#   geappliances/{device_id}/erd/0x{erd_id}/value  - ERD value as hex string
#   geappliances/{device_id}/uptime                - Uptime in seconds
#   geappliances/{device_id}/minHeap               - Minimum free heap
#   geappliances/{device_id}/currentHeap           - Current free heap
#   geappliances/{device_id}/lastErd               - Last successfully polled ERD
#
# MQTT topics subscribed:
#   geappliances/{device_id}/erd/0x{erd_id}/write  - Write hex value to ERD
#
# The component uses a hierarchical state machine (HSM) with these states:
#   1. IdentifyAppliance  - Reads ERD 0x0008 to identify the appliance type
#   2. AddCommonErds      - Discovers which common ERDs the appliance supports
#   3. AddEnergyErds      - Discovers which energy ERDs the appliance supports
#   4. AddApplianceErds   - Discovers appliance-type-specific ERDs
#   5. PollErdsFromList   - Continuously polls all discovered ERDs
#
# The discovered ERD polling list is persisted to NV storage so subsequent
# startups skip the discovery phase and go straight to polling.

external_components:
  - source:
      type: git
      url: https://github.com/joshualongenecker/home-assistant-adapter-gea3-poll
      ref: copilot/create-esphome-gea2-polling-feature
    components: [geappliances_bridge]

geappliances_bridge:
  gea2_uart_id: gea2_uart
  device_id: "my_ge_appliance"  # Unique identifier for this appliance
